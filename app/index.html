<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Timeblocks" />
  <meta name="theme-color" content="#080b10" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="manifest" href="manifest.json" />
  <title>Timeblocks</title>
  <style>
    :root {
      --bg: #080b10;
      --card: #111620;
      --card-done: #0c0f16;
      --border: #1e2738;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #526077;
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.14);
      --green: #10b981;
      --green-soft: rgba(16, 185, 129, 0.15);
      --amber: #f59e0b;
      --amber-soft: rgba(245, 158, 11, 0.14);
      --red: #ef4444;
      --red-soft: rgba(239, 68, 68, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: env(safe-area-inset-top, 10px) 12px calc(env(safe-area-inset-bottom, 16px) + 20px) 12px;
      max-width: 500px;
      margin: 0 auto;
    }

    /* Ultra-Compact Top Bar: Day Title + Progress + Small '+' Box at Top Right */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 2px 10px 2px;
      gap: 8px;
    }

    .title-group {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
    }

    .day-title {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .progress-pill {
      font-size: 12px;
      font-weight: 700;
      color: var(--green);
      background: var(--green-soft);
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .day-select {
      background: var(--card);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 12px;
      font-weight: 600;
    }

    .icon-box-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .icon-box-btn.add-btn {
      background: var(--accent-soft);
      border-color: rgba(59, 130, 246, 0.4);
      color: #60a5fa;
    }

    /* Section Headers */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 4px 6px 4px;
      margin-top: 4px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }

    .section-badge {
      font-size: 11px;
      font-weight: 700;
      color: #60a5fa;
    }

    .completed-workouts-btn {
      font-size: 11px;
      font-weight: 700;
      color: #34d399;
      background: var(--green-soft);
      border: 1px solid rgba(16, 185, 129, 0.35);
      padding: 3px 9px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .completed-workouts-btn:active {
      background: var(--green);
      color: #05140d;
    }

    /* Dedicated Completed Workouts Sub-Page Overlay */
    .subpage-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 105;
      display: none;
      flex-direction: column;
      overflow-y: auto;
      padding: env(safe-area-inset-top, 14px) 14px calc(env(safe-area-inset-bottom, 20px) + 20px) 14px;
    }

    .subpage-overlay.open {
      display: flex;
    }

    .subpage-inner {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .subpage-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .back-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 11px;
      border-radius: 9px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .completed-summary-card {
      background: var(--card);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 13px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .completed-summary-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .restore-btn {
      height: 28px;
      padding: 0 9px;
      border-radius: 7px;
      border: 1px solid #2b374d;
      background: #172030;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .restore-btn:active {
      background: var(--accent);
      color: #fff;
    }

    .hiding-badge {
      font-size: 10px;
      font-weight: 700;
      color: var(--amber);
      background: var(--amber-soft);
      padding: 2px 6px;
      border-radius: 6px;
      margin-left: 4px;
    }

    .completed-summary-title {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text);
    }

    .completed-summary-sub {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .completed-summary-val {
      font-size: 15px;
      font-weight: 800;
      color: #34d399;
      background: var(--green-soft);
      padding: 5px 10px;
      border-radius: 9px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    /* Workouts Hub (Top Section Outside Timeblocks) */
    .workouts-hub {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 14px;
    }

    .workout-card {
      background: var(--card);
      border: 1px solid #222e42;
      border-radius: 13px;
      padding: 9px 11px;
      transition: all 0.15s ease;
    }

    .workout-card.completed {
      background: var(--card-done);
      border-color: #16222f;
    }

    /* Bubble Checklist (Timeblocked Schedule Below Workouts) */
    .bubble-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .bubble-row {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 9px 11px;
      transition: background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .bubble-row.completed {
      background: var(--card-done);
      border-color: #151b26;
    }

    /* Progressive Red Urgency Heat for Pushed Tasks (1x -> 4x+) */
    .bubble-row.push-heat-1:not(.completed) {
      background: linear-gradient(90deg, rgba(239, 68, 68, 0.09), #111620 75%);
      border-color: rgba(239, 68, 68, 0.35);
    }

    .bubble-row.push-heat-2:not(.completed) {
      background: linear-gradient(90deg, rgba(239, 68, 68, 0.18), #141218 85%);
      border-color: rgba(239, 68, 68, 0.55);
    }

    .bubble-row.push-heat-3:not(.completed) {
      background: linear-gradient(90deg, rgba(239, 68, 68, 0.28), #1a1116 90%);
      border-color: rgba(239, 68, 68, 0.78);
      box-shadow: inset 0 0 10px rgba(239, 68, 68, 0.15);
    }

    .bubble-row.push-heat-4:not(.completed) {
      background: linear-gradient(90deg, rgba(220, 38, 38, 0.42), #231015 95%);
      border-color: #ef4444;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.28), inset 0 0 12px rgba(239, 68, 68, 0.22);
    }

    .row-main {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Bubble Circle */
    .bubble-circle {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #475569;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .bubble-row.completed .bubble-circle,
    .workout-card.completed .bubble-circle {
      background: var(--green);
      border-color: var(--green);
    }

    .bubble-circle svg {
      width: 14px;
      height: 14px;
      stroke: #06110b;
      stroke-width: 3.2;
      fill: none;
      opacity: 0;
    }

    .bubble-row.completed .bubble-circle svg,
    .workout-card.completed .bubble-circle svg {
      opacity: 1;
    }

    .row-text {
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    .row-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .row-line-left {
      display: flex;
      align-items: baseline;
      gap: 7px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .time-str {
      font-size: 12px;
      font-weight: 700;
      color: #60a5fa;
      white-space: nowrap;
    }

    .bubble-row.completed .time-str {
      color: var(--text-dim);
    }

    .task-str {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.28;
    }

    .bubble-row.completed .task-str {
      color: var(--text-dim);
      text-decoration: line-through;
    }

    /* Inline "Not Today" Push Button — Ultra-Compact, Zero Extra Row Height */
    .not-today-btn {
      flex-shrink: 0;
      height: 21px;
      padding: 0 7px;
      border-radius: 6px;
      border: 1px solid #283347;
      background: #151c28;
      color: #94a3b8;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.01em;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.14s ease;
    }

    .not-today-btn:hover {
      border-color: #f87171;
      color: #fca5a5;
    }

    .not-today-btn:active {
      transform: scale(0.95);
    }

    /* Button gets progressively redder with each push */
    .not-today-btn.heat-1 {
      background: rgba(239, 68, 68, 0.16);
      border-color: rgba(239, 68, 68, 0.45);
      color: #fca5a5;
    }

    .not-today-btn.heat-2 {
      background: rgba(239, 68, 68, 0.28);
      border-color: rgba(239, 68, 68, 0.7);
      color: #fecaca;
    }

    .not-today-btn.heat-3 {
      background: rgba(220, 38, 38, 0.48);
      border-color: #ef4444;
      color: #ffffff;
    }

    .not-today-btn.heat-4 {
      background: #dc2626;
      border-color: #f87171;
      color: #ffffff;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.5);
    }

    .workout-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    .workout-sub-pill {
      font-size: 11px;
      font-weight: 700;
      color: #34d399;
      background: var(--green-soft);
      padding: 2px 7px;
      border-radius: 6px;
      font-variant-numeric: tabular-nums;
    }

    .compact-plus-btn {
      height: 22px;
      min-width: 26px;
      padding: 0 7px;
      border-radius: 6px;
      border: 1px solid rgba(59, 130, 246, 0.5);
      background: var(--accent-soft);
      color: #60a5fa;
      font-size: 13px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      line-height: 1;
    }

    .compact-plus-btn:active {
      background: var(--accent);
      color: #ffffff;
    }

    /* Top-right gear button inside exercise rows */
    .gear-btn {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      border: 1px solid #263147;
      background: #151c28;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .gear-btn:active, .gear-btn.active {
      border-color: var(--accent);
      color: #60a5fa;
      background: var(--accent-soft);
    }

    .gear-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }

    /* Dedicated Pushups 4-Button Strip: [33] [33] [34] [+] */
    .pushup-section {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .pushup-sets-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(56px, 1fr));
      gap: 6px;
    }

    .pushup-set-btn {
      height: 36px;
      border-radius: 9px;
      border: 1px solid #2b374d;
      background: #172030;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.14s ease;
      font-variant-numeric: tabular-nums;
    }

    .pushup-set-btn.done {
      background: var(--green-soft);
      border-color: var(--green);
      color: #34d399;
    }

    .pushup-set-btn.extra-plus {
      background: var(--accent-soft);
      border-color: rgba(59, 130, 246, 0.45);
      color: #60a5fa;
    }

    .pushup-set-btn.extra-plus.has-extra {
      background: rgba(59, 130, 246, 0.24);
      border-color: #60a5fa;
      color: #93c5fd;
    }

    .pushup-summary-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-muted);
      padding: 0 2px;
    }

    .pushup-total-badge {
      font-weight: 700;
      color: #34d399;
    }

    .extra-history-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
    }

    .extra-pill {
      background: #172030;
      border: 1px solid #28344a;
      color: #93c5fd;
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* Dedicated Plank & Horse Stance Stopwatch Strip */
    .stopwatch-section {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .stopwatch-hero {
      position: relative;
      height: 52px;
      border-radius: 11px;
      border: 1px solid #28354c;
      background: #0d121b;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 13px;
      cursor: pointer;
      transition: border-color 0.15s ease, transform 0.08s ease;
    }

    .stopwatch-hero:active {
      transform: scale(0.992);
    }

    .stopwatch-hero.countdown {
      border-color: var(--amber);
      background: rgba(245, 158, 11, 0.12);
    }

    .stopwatch-hero.running {
      border-color: var(--accent);
    }

    .stopwatch-hero.running.pr-zone {
      border-color: var(--green);
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.25);
    }

    .stopwatch-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 0%;
      background: linear-gradient(90deg, rgba(59, 130, 246, 0.22), rgba(59, 130, 246, 0.35));
      transition: width 0.1s linear;
      pointer-events: none;
    }

    .stopwatch-fill.pr-fill {
      background: linear-gradient(90deg, rgba(16, 185, 129, 0.22), rgba(16, 185, 129, 0.42));
    }

    .stopwatch-left {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .stopwatch-clock {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }

    .stopwatch-hero.countdown .stopwatch-clock {
      color: #fbbf24;
    }

    .stopwatch-hero.pr-zone .stopwatch-clock {
      color: #34d399;
    }

    .stopwatch-sub {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .stopwatch-action-pill {
      position: relative;
      z-index: 2;
      padding: 7px 13px;
      border-radius: 9px;
      font-size: 12.5px;
      font-weight: 800;
      background: var(--accent);
      color: #ffffff;
      border: none;
      letter-spacing: 0.01em;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .stopwatch-hero.countdown .stopwatch-action-pill {
      background: var(--amber);
      color: #0b0e14;
    }

    .stopwatch-hero.running .stopwatch-action-pill {
      background: var(--red);
      color: #ffffff;
      animation: pulse 1.1s infinite;
    }

    .stopwatch-hero.running.pr-zone .stopwatch-action-pill {
      background: var(--green);
      color: #05140d;
      animation: none;
    }

    .stopwatch-controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .sw-quick-btns {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .sw-chip-btn {
      height: 27px;
      padding: 0 9px;
      border-radius: 7px;
      border: 1px solid #2b374d;
      background: #172030;
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-variant-numeric: tabular-nums;
    }

    .sw-chip-btn:active {
      background: var(--accent);
      color: #fff;
    }

    .sw-chip-btn.baseline-btn {
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.35);
      background: var(--green-soft);
    }

    .sw-goal-text {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-dim);
      text-align: right;
    }

    /* Compact Peloton Grid inside Top Workouts Hub */
    .peloton-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .peloton-mini-card {
      background: var(--card);
      border: 1px solid #222e42;
      border-radius: 12px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .peloton-mini-card.completed {
      background: var(--card-done);
      border-color: #16222f;
    }

    .peloton-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      cursor: pointer;
    }

    .peloton-top-left {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .peloton-mini-card.completed .bubble-circle {
      background: var(--green);
      border-color: var(--green);
    }

    .peloton-mini-card.completed .bubble-circle svg {
      opacity: 1;
    }

    .peloton-btns-row {
      display: flex;
      gap: 4px;
    }

    .peloton-dur-btn {
      flex: 1;
      height: 27px;
      border-radius: 7px;
      border: 1px solid #2b374d;
      background: #172030;
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .peloton-dur-btn.selected {
      background: var(--green-soft);
      border-color: var(--green);
      color: #34d399;
    }

    /* Inline Gear Config Drawer */
    .gear-config-drawer {
      display: none;
      background: #0b0e15;
      border: 1px solid #253047;
      border-radius: 10px;
      padding: 9px;
      gap: 8px;
      flex-direction: column;
    }

    .gear-config-drawer.open {
      display: flex;
    }

    .gear-inputs-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .gear-hold-grid {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 6px;
      align-items: center;
    }

    .gear-set-input {
      width: 56px;
      background: #131926;
      border: 1px solid #2b374d;
      color: var(--text);
      border-radius: 7px;
      padding: 6px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
    }

    .step-btn {
      width: 28px;
      height: 26px;
      border-radius: 7px;
      border: 1px solid #2b374d;
      background: #172030;
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.78; }

<body>

  <div id="toast" class="toast">Saved</div>

  <!-- Custom Numpad Modal for Fourth (+) Extra Pushup Set Throughout the Day -->
  <div id="numpadModal" class="numpad-backdrop" onclick="if(event.target===this)closeNumpad()">
    <div class="numpad-card">

  <!-- Top-Right '+' Quick Add Modal -->
  <div id="addModal" class="modal-backdrop" onclick="if(event.target===this)closeAddModal()">
    <div class="modal-card">
      <div style="font-size:14px;font-weight:700;">Quick Add Task or Timeblock</div>
      <input id="newTaskTitle" class="form-input" type="text" placeholder="Task title (e.g. Install trailer shelves)" />
      <select id="newTaskBucket" class="form-select" onchange="toggleTimeInput(this.value)">
        <option value="today">Today's Timeblock Schedule</option>
        <option value="This week">Tier 1: This week</option>
        <option value="This month">Tier 2: This month</option>
        <option value="YouTube">Tier 3: YouTube Ideas & Production</option>
        <option value="Bigger projects">Tier 4: Bigger projects (Sat 4-hr block)</option>
        <option value="Computer Tasks">Tier 5: Computer Tasks (CAD / MWI)</option>
        <option value="General To Do">Tier 6: General To Do</option>
      </select>
      <input id="newTaskTime" class="form-input" type="text" placeholder="Time range (e.g. 4:30 - 5:00 PM)" />
      <div class="modal-actions">
        <button class="btn-sm" style="background:#1e2636;color:#cbd5e1;" onclick="closeAddModal()">Cancel</button>
        <button class="btn-sm" style="background:var(--accent);color:#fff;" onclick="submitQuickAdd()">Add</button>
      </div>
    </div>
  </div>

  <script>
    let appState = null;
    let currentDayKey = "2026-11-19";
    let activeTier = "This week";
    let activeTimers = {};
    let openGearKey = null;
    let numpadBuffer = "";
    let hidePendingTimers = {}; // workoutKey -> { timeoutId, expiresAt }
    let hiddenWorkouts = {};    // `${dayKey}:${workoutKey}` -> true (auto-hidden 5s after completion)

    function scheduleAutoHide(workoutKey) {
      const fullKey = `${currentDayKey}:${workoutKey}`;
      if (hidePendingTimers[fullKey]) {
        clearTimeout(hidePendingTimers[fullKey].timeoutId);
      }
      hiddenWorkouts[fullKey] = false;
      const expiresAt = Date.now() + 5000;
      const timeoutId = setTimeout(() => {
        delete hidePendingTimers[fullKey];
        hiddenWorkouts[fullKey] = true;
        renderAll();
      }, 5000);
      hidePendingTimers[fullKey] = { timeoutId, expiresAt };
    }

    function cancelAutoHide(workoutKey) {
      const fullKey = `${currentDayKey}:${workoutKey}`;
      if (hidePendingTimers[fullKey]) {
        clearTimeout(hidePendingTimers[fullKey].timeoutId);
        delete hidePendingTimers[fullKey];
      }
      delete hiddenWorkouts[fullKey];
    }

    function isWorkoutHidden(workoutKey, isDone) {
      if (!isDone) return false;
      const fullKey = `${currentDayKey}:${workoutKey}`;
      // If a 5s timer is actively counting down, keep it visible until timer fires
      if (hidePendingTimers[fullKey]) return false;
      // If it was already completed when page loaded (or after 5s elapsed), hide it
      if (hiddenWorkouts[fullKey] === false) return false;
      return true;
    }

    const GEAR_SVG = `
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>`;

    const CHECK_SVG = `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>`;

    const RECURRING_REGEX = /(Morning Routine|Commute to Work|Commute Home|^Work$|Dinner|Feed Dogs|Walk Dogs|Evening Peloton|Wind Down & Sleep|Daytime Buffer|Project Buffer|Workshop Tidy)/i;

    function isRecurringBlock(b) {
      if (typeof b.recurring === "boolean") return b.recurring;
      return RECURRING_REGEX.test(b.task || "");
    }

    function getHeatLevel(pushCount) {
      const c = Number(pushCount || 0);
      if (c <= 0) return 0;
      return Math.min(4, c);
    }

    function fmtSec(totalSec) {
      const s = Math.max(0, Math.round(totalSec));
      const m = Math.floor(s / 60);
      const rem = s % 60;
      return `${m}:${rem < 10 ? "0" + rem : rem}`;
    }

    function fmtSecTenths(totalSecFloat) {
      const s = Math.max(0, totalSecFloat);
      const m = Math.floor(s / 60);
      const rem = Math.floor(s % 60);
      const tenths = Math.floor((s - Math.floor(s)) * 10);
      return `${m}:${rem < 10 ? "0" + rem : rem}.${tenths}`;
    }

    function parseMmSs(str, fallbackSec) {
      if (!str) return fallbackSec;
      const clean = String(str).trim();
      if (clean.includes(":")) {
        const parts = clean.split(":");
        const m = parseInt(parts[0], 10) || 0;
        const s = parseInt(parts[1], 10) || 0;
        return m * 60 + s;
      }
      return parseInt(clean, 10) || fallbackSec;
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2000);
    }

    function getHoldConfig() {
      if (!appState.holdConfig) {
        appState.holdConfig = {
          plankTargetSec: 105,
          plankGoalSec: 300,
          horseTargetSec: 80,
          horseGoalSec: 240,
          countdownSec: 3
        };
      }
      return appState.holdConfig;
    }

    function getPushupSetConfig() {
      if (!Array.isArray(appState.pushupSetConfig) || appState.pushupSetConfig.length < 1) {
        appState.pushupSetConfig = [33, 33, 34];
      }
      return appState.pushupSetConfig;
    }

    function ensureDayWorkoutData(day) {
      day.metrics = day.metrics || {};
      const cfg = getPushupSetConfig();
      if (!Array.isArray(day.metrics.pushup_sets_done)) {
        const wasDone = Number(day.metrics.pushups_morning || 0) >= cfg.reduce((a, b) => a + Number(b || 0), 0);
        day.metrics.pushup_sets_done = cfg.map(() => wasDone);
      } else if (day.metrics.pushup_sets_done.length !== cfg.length) {
        const prev = day.metrics.pushup_sets_done;
        day.metrics.pushup_sets_done = cfg.map((_, i) => Boolean(prev[i]));
      }
      if (!Array.isArray(day.metrics.pushup_extra_log)) {
        const existingDay = Number(day.metrics.pushups_day || 0);
        day.metrics.pushup_extra_log = existingDay > 0 ? [existingDay] : [];
      }
      if (typeof day.metrics.plank_done !== "boolean") day.metrics.plank_done = false;
      if (typeof day.metrics.horse_done !== "boolean") day.metrics.horse_done = false;
      if (typeof day.metrics.peloton_bike_done !== "boolean") day.metrics.peloton_bike_done = false;
      if (typeof day.metrics.peloton_stretch_done !== "boolean") day.metrics.peloton_stretch_done = false;
      if (typeof day.metrics.peloton_ab_done !== "boolean") day.metrics.peloton_ab_done = false;
      recalcPushupTotals(day);
    }

    function recalcPushupTotals(day) {
      const cfg = getPushupSetConfig();
      const doneArr = day.metrics.pushup_sets_done || cfg.map(() => false);
      let amTotal = 0;
      for (let i = 0; i < cfg.length; i++) {
        if (doneArr[i]) amTotal += Number(cfg[i] || 0);
      }
      const extraLog = day.metrics.pushup_extra_log || [];
      const extraTotal = extraLog.reduce((acc, v) => acc + Number(v || 0), 0);

      day.metrics.pushups_morning = amTotal;
      day.metrics.pushups_morning_sets = cfg.join("/");
      day.metrics.pushups_day = extraTotal;
    }

    /* "Not Today" — Increments pushCount (turning it progressively redder) & pushes task to next day */
    function pushTaskNotToday(blockIdx) {
      const dayKeys = Object.keys(appState.days).sort();
      const curDayIdx = dayKeys.indexOf(currentDayKey);
      const curDay = appState.days[currentDayKey];
      const block = curDay.blocks[blockIdx];
      if (!block) return;

      const newPushCount = Number(block.pushCount || 0) + 1;
      block.pushCount = newPushCount;

      // Also bump matching backlog item's pushCount if it exists
      const matchingBacklog = (appState.backlog || []).find(
        x => x.title && block.task && (block.task.toLowerCase().includes(x.title.toLowerCase().slice(0, 14)))
      );
      if (matchingBacklog) {
        matchingBacklog.pushCount = Math.max(Number(matchingBacklog.pushCount || 0) + 1, newPushCount);
      }

      // If there is a next day in the schedule, move/insert the task into tomorrow's afternoon project window
      if (curDayIdx >= 0 && curDayIdx + 1 < dayKeys.length) {
        const nextDayKey = dayKeys[curDayIdx + 1];
        const nextDay = appState.days[nextDayKey];

        // Remove from today's blocks and re-number rows
        curDay.blocks.splice(blockIdx, 1);
        curDay.blocks.forEach((b, i) => { b.row = i + 1; });

        // Find ideal insertion slot in tomorrow (right before Dinner, or row 6)
        let insertIdx = nextDay.blocks.findIndex(b => /Dinner/i.test(b.task));
        if (insertIdx < 0) insertIdx = Math.min(5, nextDay.blocks.length);

        const pushedBlock = {
          row: insertIdx + 1,
          time: block.time || "3:15 - 5:00 PM",
          task: block.task,
          completed: false,
          recurring: false,
          pushCount: newPushCount,
          metricKeys: []
        };
        nextDay.blocks.splice(insertIdx, 0, pushedBlock);
        nextDay.blocks.forEach((b, i) => { b.row = i + 1; });

        showToast(`Pushed to ${nextDay.label} (Pushed ${newPushCount}x — getting redder!)`);
      } else {
        // Last day of loaded week: increment heat in place so user sees the red warning immediately
        showToast(`Marked Not Today (Pushed ${newPushCount}x — urgency increased!)`);
      }

      renderAll();
      saveState(true);
    }

    function pushBacklogItemNotToday(id) {
      const item = (appState.backlog || []).find(x => x.id === id);
      if (!item) return;
      item.pushCount = Number(item.pushCount || 0) + 1;
      renderBacklog();
      saveState(true);
      showToast(`Pushed "${item.title.slice(0, 22)}..." (${item.pushCount}x)`);
    }

    function togglePushupAll() {
      const day = appState.days[currentDayKey];
      ensureDayWorkoutData(day);
      const done = day.metrics.pushup_sets_done;
      const allDone = done.length > 0 && done.every(Boolean);
      const nextDone = !allDone;
      day.metrics.pushup_sets_done = done.map(() => nextDone);
      recalcPushupTotals(day);
      renderAll();
      saveState(true);
    }

    function togglePushupSet(setIdx) {
      const day = appState.days[currentDayKey];
      ensureDayWorkoutData(day);
      day.metrics.pushup_sets_done[setIdx] = !day.metrics.pushup_sets_done[setIdx];
      recalcPushupTotals(day);
      renderAll();
      saveState(true);
    }

    function toggleWorkoutDone(field) {
      const day = appState.days[currentDayKey];
      ensureDayWorkoutData(day);
      day.metrics[field] = !day.metrics[field];
      const wKey = field.replace("_done", "");
      if (day.metrics[field]) scheduleAutoHide(wKey);
      else cancelAutoHide(wKey);
      renderAll();
      saveState(true);
    }

    function setPelotonDuration(metricKey, doneKey, mins) {
      const day = appState.days[currentDayKey];
      ensureDayWorkoutData(day);
      day.metrics[metricKey] = mins;
      day.metrics[doneKey] = mins > 0;
      const wKey = doneKey.replace("_done", "");
      if (mins > 0) scheduleAutoHide(wKey);
      else cancelAutoHide(wKey);
      renderAll();
      saveState(true);
    }

    function toggleGear(key) {
      openGearKey = (openGearKey === key) ? null : key;
      renderAll();
    }

    function readGearSetInputs() {
      const cfg = getPushupSetConfig();
      return cfg.map((oldVal, idx) => {
        const el = document.getElementById(`gearSet${idx}`);
        return el ? Math.max(1, parseInt(el.value, 10) || oldVal) : oldVal;
      });
    }

    function addPushupSetInGear() {
      const vals = readGearSetInputs();
      if (vals.length >= 8) return;
      const lastVal = vals[vals.length - 1] || 25;
      vals.push(lastVal);
      appState.pushupSetConfig = vals;
      renderAll();
    }

    function removePushupSetInGear() {
      const vals = readGearSetInputs();
      if (vals.length <= 1) return;
      vals.pop();
      appState.pushupSetConfig = vals;
      renderAll();
    }

    function savePushupSetConfig() {
      const newCfg = readGearSetInputs();
      appState.pushupSetConfig = newCfg;
      const newTotal = newCfg.reduce((a, b) => a + b, 0);
      const splitStr = newCfg.join("/");

      // Persist new baseline into Goals_DB projection metadata
      if (Array.isArray(appState.goals)) {
        const g = appState.goals.find(x => x.key === "pushups_morning");
        if (g) {
          g.baseline = newTotal;
          g.baselineDisplay = `${newTotal} (${splitStr})`;
        }
      }

      // Propagate new set structure to today and all future days in the schedule
      Object.entries(appState.days || {}).forEach(([dKey, dObj]) => {
        dObj.metrics = dObj.metrics || {};
        if (dKey >= currentDayKey) {
          const prevDone = Array.isArray(dObj.metrics.pushup_sets_done) ? dObj.metrics.pushup_sets_done : [];
          dObj.metrics.pushup_sets_done = newCfg.map((_, i) => Boolean(prevDone[i]));
          dObj.metrics.pushups_morning_sets = splitStr;
          recalcPushupTotals(dObj);
        }
      });

      openGearKey = null;
      renderAll();
      saveState(false);
      showToast(`New baseline saved for future days: ${newTotal} (${splitStr})`);
    }

    function saveHoldConfig(key) {
      const hc = getHoldConfig();
      const targetStr = document.getElementById(`gearHoldTarget-${key}`).value;
      const cdVal = Math.max(0, parseInt(document.getElementById(`gearHoldCd-${key}`).value, 10) || 0);
      hc.countdownSec = cdVal;
      if (key === "plank") {
        hc.plankTargetSec = parseMmSs(targetStr, 105);
      } else {
        hc.horseTargetSec = parseMmSs(targetStr, 80);
      }
      openGearKey = null;
      renderAll();
      saveState(false);
      showToast(`Updated ${key === 'plank' ? 'Plank' : 'Horse Stance'} baseline & countdown`);
    }

    /* Numpad functions for 4th (+) Extra Pushups button */
    function openNumpad() {
      numpadBuffer = "";
      document.getElementById("numpadValue").textContent = "0";
      const day = appState.days[currentDayKey];
      ensureDayWorkoutData(day);
      const extraTotal = day.metrics.pushups_day || 0;
      const amTotal = day.metrics.pushups_morning || 0;
      document.getElementById("numpadRunningSub").textContent =
        `Current today: ${amTotal} AM + ${extraTotal} Extra = ${amTotal + extraTotal} Total`;
      document.getElementById("numpadModal").classList.add("open");
    }

    function closeNumpad() {
      document.getElementById("numpadModal").classList.remove("open");
    }

    function pressNum(digit) {
      if (numpadBuffer.length >= 3) return;
      if (numpadBuffer === "0") numpadBuffer = digit;
      else numpadBuffer += digit;
      document.getElementById("numpadValue").textContent = numpadBuffer || "0";
    }

    function setNumDirect(valStr) {
      numpadBuffer = valStr;
      document.getElementById("numpadValue").textContent = numpadBuffer;
    }

    function pressBackspace() {
      numpadBuffer = numpadBuffer.slice(0, -1);
      document.getElementById("numpadValue").textContent = numpadBuffer || "0";
    }

    function submitExtraPushups() {
      const reps = parseInt(numpadBuffer, 10) || 0;
      if (reps <= 0) {
        closeNumpad();
        return;
      }
      const day = appState.days[currentDayKey];
      ensureDayWorkoutData(day);
      day.metrics.pushup_extra_log.push(reps);
      recalcPushupTotals(day);
      closeNumpad();
      renderAll();
      if (document.getElementById("completedWorkoutsPage").classList.contains("open")) {
        openCompletedWorkoutsPage();
      }
      saveState(true);
      showToast(`+${reps} pushups added (Total: ${day.metrics.pushups_morning + day.metrics.pushups_day})`);
    }

    function removeExtraSubmission(idx) {
      const day = appState.days[currentDayKey];
      ensureDayWorkoutData(day);
      const removed = day.metrics.pushup_extra_log.splice(idx, 1);
      recalcPushupTotals(day);
      renderAll();
      saveState(true);
      showToast(`Removed +${removed[0]} extra set`);
    }

    const CLOUD_API_URL = "https://script.google.com/macros/s/AKfycbz64ug5Ys6N4Kz8vEzsJfOyxhf6bKtqSD63CLuWjzDfTds_pBdH4RH6Pl8spCZx-LSxNg/exec";
    const IS_LOCAL_DEV = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
    const IS_GAS_FRAME = typeof google !== "undefined" && google.script && google.script.run;

    async function loadState(manualRefresh = false) {
      if (IS_GAS_FRAME) {
        google.script.run.withSuccessHandler(function(data) {
          appState = data;
          currentDayKey = appState.activeDay || Object.keys(appState.days)[0];
          renderAll();
          if (manualRefresh) showToast("Refreshed from Cloud");
        }).readLiveState();
        return;
      }

      if (IS_LOCAL_DEV) {
        try {
          const res = await fetch("/api/state");
          appState = await res.json();
        } catch (e) {
          const res = await fetch("schedule_state.json");
          appState = await res.json();
        }
      } else {
        // GitHub Pages / Standalone PWA: instant render from localStorage cache, then live pull from Google Sheet Cloud
        const cached = localStorage.getItem("timeblocks_state_v1");
        if (cached && !appState) {
          try {
            appState = JSON.parse(cached);
            currentDayKey = appState.activeDay || Object.keys(appState.days)[0];
            renderAll();
          } catch (_) {}
        }
        try {
          const res = await fetch(`${CLOUD_API_URL}?api=state&t=${Date.now()}`);
          const liveData = await res.json();
          if (liveData && liveData.days) {
            appState = liveData;
            localStorage.setItem("timeblocks_state_v1", JSON.stringify(appState));
          }
        } catch (e) {
          if (!appState) {
            showToast("Offline mode");
            return;
          }
        }
      }

      currentDayKey = appState.activeDay || Object.keys(appState.days)[0];

      const params = new URLSearchParams(window.location.search);
      if (params.get("toggleRow")) {
        const r = parseInt(params.get("toggleRow"), 10);
        const day = appState.days[currentDayKey];
        const b = day.blocks.find(x => x.row === r);
        if (b) {
          b.completed = !b.completed;
          saveState(true);
        }
      } else if (params.get("quickAdd") === "1") {
        setTimeout(() => openAddModal(), 100);
      }

      renderAll();
      if (manualRefresh) showToast("Synced with Cloud");
    }

    function selectDay(dayKey) {
      currentDayKey = dayKey;
      appState.activeDay = dayKey;
      renderAll();
      saveState(true);
    }

    function toggleBlock(idx) {
      const day = appState.days[currentDayKey];
      day.blocks[idx].completed = !day.blocks[idx].completed;
      renderAll();
      saveState(true);
    }

    function stepMetric(key, delta) {
      const day = appState.days[currentDayKey];
      const m = day.metrics;
      if (key === "plank") {
        m.plank_sec = Math.max(5, Number(m.plank_sec || 105) + delta);
      } else if (key === "horse_stance") {
        m.horse_sec = Math.max(5, Number(m.horse_sec || 80) + delta);
      }
      renderAll();
      saveState(true);
    }

    function logBaselineHold(key, targetSec) {
      const day = appState.days[currentDayKey];
      const m = day.metrics;
      if (key === "plank") {
        m.plank_sec = targetSec;
        m.plank_done = true;
        scheduleAutoHide("plank");
        showToast(`Plank baseline logged: ${fmtSec(targetSec)}`);
      } else if (key === "horse_stance") {
        m.horse_sec = targetSec;
        m.horse_done = true;
        scheduleAutoHide("horse");
        showToast(`Horse Stance baseline logged: ${fmtSec(targetSec)}`);
      }
      renderAll();
      saveState(true);
    }

    /* Full-Width Stopwatch with 3-Second Get-Set Countdown & Live Progress Fill */
    function toggleStopwatch(key, targetSec) {
      const day = appState.days[currentDayKey];
      const m = day.metrics;
      const hc = getHoldConfig();

      if (activeTimers[key]) {
        const tObj = activeTimers[key];
        clearInterval(tObj.intervalId);
        delete activeTimers[key];

        if (tObj.phase === "countdown") {
          showToast("Countdown cancelled");
          renderAll();
          return;
        }

        const elapsedSec = Math.max(1, Math.round((Date.now() - tObj.holdStartMs) / 1000));
        if (key === "plank") {
          m.plank_sec = elapsedSec;
          m.plank_done = true;
          scheduleAutoHide("plank");
          if (elapsedSec > hc.plankTargetSec) hc.plankTargetSec = elapsedSec;
          showToast(`Plank logged: ${fmtSec(elapsedSec)}${elapsedSec >= targetSec ? " (Target Met!)" : ""}`);
        } else if (key === "horse_stance") {
          m.horse_sec = elapsedSec;
          m.horse_done = true;
          scheduleAutoHide("horse");
          if (elapsedSec > hc.horseTargetSec) hc.horseTargetSec = elapsedSec;
          showToast(`Horse Stance logged: ${fmtSec(elapsedSec)}${elapsedSec >= targetSec ? " (Target Met!)" : ""}`);
        }
        renderAll();
        saveState(true);
        return;
      }

      const cdSec = Number(hc.countdownSec ?? 3);
      const clickMs = Date.now();
      const holdStartMs = clickMs + cdSec * 1000;

      const timerState = {
        phase: cdSec > 0 ? "countdown" : "hold",
        clickMs,
        holdStartMs,
        targetSec,
        intervalId: null
      };

      timerState.intervalId = setInterval(() => {
        const now = Date.now();
        const heroEl = document.getElementById(`sw-hero-${key}`);
        const clockEl = document.getElementById(`sw-clock-${key}`);
        const subEl = document.getElementById(`sw-sub-${key}`);
        const pillEl = document.getElementById(`sw-pill-${key}`);
        const fillEl = document.getElementById(`sw-fill-${key}`);
        if (!heroEl || !clockEl) return;

        if (now < holdStartMs) {
          timerState.phase = "countdown";
          const rem = Math.ceil((holdStartMs - now) / 1000);
          heroEl.className = "stopwatch-hero countdown";
          clockEl.textContent = `Get Set... ${rem}`;
          subEl.textContent = `Get into position — timer starts at 0`;
          pillEl.textContent = "Cancel";
          fillEl.style.width = "0%";
        } else {
          timerState.phase = "hold";
          const elapsedFloat = (now - holdStartMs) / 1000;
          const elapsedInt = Math.floor(elapsedFloat);
          const pct = Math.min(100, (elapsedFloat / targetSec) * 100);
          const isPr = elapsedInt >= targetSec;

          heroEl.className = "stopwatch-hero running" + (isPr ? " pr-zone" : "");
          fillEl.className = "stopwatch-fill" + (isPr ? " pr-fill" : "");
          fillEl.style.width = `${pct}%`;
          clockEl.textContent = fmtSecTenths(elapsedFloat);

          if (isPr) {
            const bonus = elapsedInt - targetSec;
            subEl.textContent = bonus > 0 ? `NEW PR! +${bonus}s above ${fmtSec(targetSec)} baseline` : `BASELINE HIT (${fmtSec(targetSec)}) — Keep holding!`;
            pillEl.textContent = "TAP TO LOG PR";
          } else {
            const left = targetSec - elapsedInt;
            subEl.textContent = `${fmtSec(left)} remaining to ${fmtSec(targetSec)} baseline`;
            pillEl.textContent = "TAP TO STOP";
          }
        }
      }, 80);

      activeTimers[key] = timerState;
      renderAll();
    }

    /* Render Top Workouts Hub (Outside of Timeblocks) */
    function renderWorkoutsHub(day) {
      ensureDayWorkoutData(day);
      const m = day.metrics;
      const cfg = getPushupSetConfig();
      const hc = getHoldConfig();

      const doneSets = m.pushup_sets_done;
      const pushupsAllDone = doneSets.length > 0 && doneSets.every(Boolean);
      const extraLog = m.pushup_extra_log || [];
      const extraTotal = m.pushups_day || 0;
      const amTotal = m.pushups_morning || 0;
      const amTarget = cfg.reduce((a, b) => a + Number(b || 0), 0);
      const grandTotal = amTotal + extraTotal;

      const workoutChecks = [
        pushupsAllDone,
        Boolean(m.plank_done),
        Boolean(m.horse_done),
        Boolean(m.peloton_bike_done),
        Boolean(m.peloton_stretch_done)
      ];
      const wDoneCount = workoutChecks.filter(Boolean).length;
      document.getElementById("workoutProgressBadge").textContent = `${wDoneCount}/5 Completed`;

      // Show "Completed (X) ->" button as soon as 1 or more workouts are complete
      const cwBtn = document.getElementById("completedWorkoutsBtn");
      const cwCount = document.getElementById("completedWorkoutsBtnCount");
      if (cwBtn && cwCount) {
        if (wDoneCount >= 1) {
          cwBtn.style.display = "inline-flex";
          cwCount.textContent = wDoneCount;
        } else {
          cwBtn.style.display = "none";
        }
      }

      // Pushups always stays visible (compact 1-line bar with '+' once baseline done);
      // Plank, Horse Stance, Peloton Ride, and Peloton Stretch auto-hide 5s after completion.
      const hidePushups = false;
      const hidePlank = isWorkoutHidden("plank", Boolean(m.plank_done));
      const hideHorse = isWorkoutHidden("horse", Boolean(m.horse_done));
      const hideBike = isWorkoutHidden("peloton_bike", Boolean(m.peloton_bike_done));
      const hideStretch = isWorkoutHidden("peloton_stretch", Boolean(m.peloton_stretch_done));

      function hidingBadgeFor(wKey) {
        return hidePendingTimers[`${currentDayKey}:${wKey}`]
          ? `<span class="hiding-badge">Moving to Completed...</span>`
          : "";
      }

      const setBtnsHtml = cfg.map((reps, i) => `
        <button class="pushup-set-btn ${doneSets[i] ? 'done' : ''}" onclick="event.stopPropagation(); togglePushupSet(${i})">
          ${doneSets[i] ? "✓ " : ""}${reps}
        </button>
      `).join("");

      const plusBtnLabel = extraTotal > 0 ? `+ (${extraTotal})` : `+`;
      const extraPillsHtml = extraLog.map((val, idx) =>
        `<span class="extra-pill" title="Tap to remove" onclick="event.stopPropagation(); removeExtraSubmission(${idx})">+${val}</span>`
      ).join("");

      const compactPlusHTML = pushupsAllDone
        ? `<button class="compact-plus-btn" title="Add extra pushups" onclick="event.stopPropagation(); openNumpad()">+</button>`
        : "";

      const gearSetInputsHtml = cfg.map((reps, i) =>
        `<input id="gearSet${i}" class="gear-set-input" type="number" min="1" value="${reps}" />`
      ).join("");

      const gearDrawerHTML = `
        <div class="gear-config-drawer ${openGearKey === 'pushups' ? 'open' : ''}" style="margin-top:${pushupsAllDone ? '8px' : '0'};" onclick="event.stopPropagation()">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;">
            <span style="font-size:11px;font-weight:700;color:var(--text-muted);">Baseline Sets (${cfg.length} sets · saved for future days):</span>
            <div style="display:flex;gap:4px;">
              <button class="sw-chip-btn" style="height:24px;padding:0 8px;" onclick="removePushupSetInGear()" ${cfg.length <= 1 ? 'disabled style="opacity:0.4;"' : ''}>- Set</button>
              <button class="sw-chip-btn" style="height:24px;padding:0 8px;color:#60a5fa;border-color:rgba(59,130,246,0.4);" onclick="addPushupSetInGear()">+ Set</button>
            </div>
          </div>
          <div class="gear-inputs-grid">
            ${gearSetInputsHtml}
            <button class="btn-sm" style="background:var(--accent);color:#fff;padding:7px 12px;margin-left:auto;" onclick="savePushupSetConfig()">Save</button>
          </div>
        </div>
      `;

      const pushupBodyHTML = pushupsAllDone
        ? `
          ${extraLog.length > 0 ? `
            <div class="pushup-summary-line" style="margin-top:6px;" onclick="event.stopPropagation()">
              <div class="extra-history-pills">
                <span>Extra sets:</span>
                ${extraPillsHtml}
              </div>
              <span class="pushup-total-badge">AM ${amTotal} + ${extraTotal}</span>
            </div>
          ` : ""}
          ${gearDrawerHTML}
        `
        : `
          <div class="pushup-section" onclick="event.stopPropagation()">
            <div class="pushup-sets-row">
              ${setBtnsHtml}
              <button class="pushup-set-btn extra-plus ${extraTotal > 0 ? 'has-extra' : ''}" onclick="openNumpad()">
                ${plusBtnLabel}
              </button>
            </div>
            <div class="pushup-summary-line">
              <div class="extra-history-pills">
                <span>AM: ${amTotal}/${amTarget}</span>
                ${extraPillsHtml}
              </div>
              <span class="pushup-total-badge">Total: ${grandTotal}</span>
            </div>
            ${gearDrawerHTML}
          </div>
        `;

      const pushupsCardHTML = hidePushups ? "" : `
        <div class="workout-card ${pushupsAllDone ? 'completed' : ''}">
          <div class="row-main" onclick="togglePushupAll()">
            <div class="bubble-circle">${CHECK_SVG}</div>
            <div class="row-text">
              <div class="row-line">
                <div class="row-line-left">
                  <span class="workout-title">Pushups</span>
                  <span class="workout-sub-pill">${grandTotal} reps</span>
                  ${compactPlusHTML}
                  ${hidingBadgeFor("pushups")}
                </div>
                <button class="gear-btn ${openGearKey === 'pushups' ? 'active' : ''}" title="Adjust Set Numbers" onclick="event.stopPropagation(); toggleGear('pushups')">
                  ${GEAR_SVG}
                </button>
              </div>
            </div>
          </div>
          ${pushupBodyHTML}
        </div>
      `;

      function buildHoldCard(key, title, doneField) {
        const isPlank = key === "plank";
        const wKey = isPlank ? "plank" : "horse";
        const isDone = Boolean(m[doneField]);
        if ((isPlank && hidePlank) || (!isPlank && hideHorse)) return "";

        const curSec = Number(isPlank ? (m.plank_sec ?? 105) : (m.horse_sec ?? 80));
        const targetSec = Number(isPlank ? (hc.plankTargetSec ?? 105) : (hc.horseTargetSec ?? 80));
        const goalSec = Number(isPlank ? (hc.plankGoalSec ?? 300) : (hc.horseGoalSec ?? 240));
        const pct = Math.min(100, Math.round((curSec / targetSec) * 100));
        const isPr = curSec >= targetSec;

        const holdGearHTML = `
          <div class="gear-config-drawer ${openGearKey === key ? 'open' : ''}" style="margin-top:${isDone ? '8px' : '0'};" onclick="event.stopPropagation()">
            <div style="font-size:11px;font-weight:700;color:var(--text-muted);">Adjust Baseline Target (mm:ss) & Get-Set Countdown (sec):</div>
            <div class="gear-hold-grid">
              <input id="gearHoldTarget-${key}" class="gear-set-input" type="text" value="${fmtSec(targetSec)}" placeholder="1:45" />
              <input id="gearHoldCd-${key}" class="gear-set-input" type="number" value="${hc.countdownSec}" placeholder="3" />
              <button class="btn-sm" style="background:var(--accent);color:#fff;padding:7px 11px;" onclick="saveHoldConfig('${key}')">Save</button>
            </div>
          </div>
        `;

        // Minimize stopwatch body once complete (same compact pattern as Pushups)
        const holdBodyHTML = isDone
          ? holdGearHTML
          : `
            <div class="stopwatch-section" onclick="event.stopPropagation()">
              <div id="sw-hero-${key}" class="stopwatch-hero" onclick="toggleStopwatch('${key}', ${targetSec})">
                <div id="sw-fill-${key}" class="stopwatch-fill ${isPr ? 'pr-fill' : ''}" style="width: ${pct}%;"></div>
                <div class="stopwatch-left">
                  <div id="sw-clock-${key}" class="stopwatch-clock">${fmtSec(curSec)}</div>
                  <div id="sw-sub-${key}" class="stopwatch-sub">Baseline: ${fmtSec(targetSec)} · ${hc.countdownSec}s Get-Set</div>
                </div>
                <div id="sw-pill-${key}" class="stopwatch-action-pill">▶ Start Hold</div>
              </div>
              <div class="stopwatch-controls-row">
                <div class="sw-quick-btns">
                  <button class="sw-chip-btn" onclick="stepMetric('${key}', -5)">-5s</button>
                  <button class="sw-chip-btn" onclick="stepMetric('${key}', 5)">+5s</button>
                  <button class="sw-chip-btn baseline-btn" onclick="logBaselineHold('${key}', ${targetSec})">✓ Log ${fmtSec(targetSec)}</button>
                </div>
                <span class="sw-goal-text">2027 Goal: ${fmtSec(goalSec)}</span>
              </div>
              ${holdGearHTML}
            </div>
          `;

        return `
          <div class="workout-card ${isDone ? 'completed' : ''}">
            <div class="row-main" onclick="toggleWorkoutDone('${doneField}')">
              <div class="bubble-circle">${CHECK_SVG}</div>
              <div class="row-text">
                <div class="row-line">
                  <div class="row-line-left">
                    <span class="workout-title">${title}</span>
                    <span class="workout-sub-pill">${fmtSec(curSec)} / ${fmtSec(targetSec)}</span>
                    ${hidingBadgeFor(wKey)}
                  </div>
                  <button class="gear-btn ${openGearKey === key ? 'active' : ''}" title="Configure Target & Countdown" onclick="event.stopPropagation(); toggleGear('${key}')">
                    ${GEAR_SVG}
                  </button>
                </div>
              </div>
            </div>
            ${holdBodyHTML}
          </div>
        `;
      }

      const bikeMin = Number(m.peloton_bike ?? 10);
      const bikeDone = Boolean(m.peloton_bike_done);
      const strMin = Number(m.peloton_stretch ?? 10);
      const strDone = Boolean(m.peloton_stretch_done);

      const bikeCardHTML = hideBike ? "" : `
          <div class="peloton-mini-card ${bikeDone ? 'completed' : ''}">
            <div class="peloton-top" onclick="toggleWorkoutDone('peloton_bike_done')">
              <div class="peloton-top-left">
                <div class="bubble-circle" style="width:20px;height:20px;">${CHECK_SVG}</div>
                <span style="font-size:13px;font-weight:700;">Peloton Ride</span>
              </div>
              <span class="workout-sub-pill">${bikeMin}m</span>
            </div>
            <div class="peloton-btns-row">
              ${[10, 15, 20, 30].map(v => `
                <button class="peloton-dur-btn ${bikeDone && bikeMin === v ? 'selected' : ''}" onclick="setPelotonDuration('peloton_bike', 'peloton_bike_done', ${v})">${v}m</button>
              `).join("")}
            </div>
          </div>`;

      const stretchCardHTML = hideStretch ? "" : `
          <div class="peloton-mini-card ${strDone ? 'completed' : ''}">
            <div class="peloton-top" onclick="toggleWorkoutDone('peloton_stretch_done')">
              <div class="peloton-top-left">
                <div class="bubble-circle" style="width:20px;height:20px;">${CHECK_SVG}</div>
                <span style="font-size:13px;font-weight:700;">Stretch</span>
              </div>
              <span class="workout-sub-pill">${strMin}m</span>
            </div>
            <div class="peloton-btns-row">
              ${[5, 10, 15, 20].map(v => `
                <button class="peloton-dur-btn ${strDone && strMin === v ? 'selected' : ''}" onclick="setPelotonDuration('peloton_stretch', 'peloton_stretch_done', ${v})">${v}m</button>
              `).join("")}
            </div>
          </div>`;

      const pelotonGridHTML = (bikeCardHTML || stretchCardHTML)
        ? `<div class="peloton-grid" style="${(!bikeCardHTML || !stretchCardHTML) ? 'grid-template-columns:1fr;' : ''}">${bikeCardHTML}${stretchCardHTML}</div>`
        : "";

      const combinedWorkoutsHTML =
        pushupsCardHTML +
        buildHoldCard("plank", "Plank Hold", "plank_done") +
        buildHoldCard("horse_stance", "Horse Stance Hold", "horse_done") +
        pelotonGridHTML;

      document.getElementById("workoutsHub").innerHTML = combinedWorkoutsHTML || `
        <div class="workout-card completed" style="text-align:center;font-size:12.5px;color:#34d399;cursor:pointer;" onclick="openCompletedWorkoutsPage()">
          ✓ All daily workouts completed — tap to view or add extra pushups →
        </div>`;
    }

    function renderAll() {
      if (!appState || !appState.days[currentDayKey]) return;
      const day = appState.days[currentDayKey];
      ensureDayWorkoutData(day);

      document.getElementById("dayTitle").textContent = day.label;
      const done = day.blocks.filter(b => b.completed).length;
      document.getElementById("progressPill").textContent = `${done}/${day.blocks.length}`;
      document.getElementById("scheduleProgressBadge").textContent = `${done}/${day.blocks.length} Blocks`;

      const sel = document.getElementById("daySelect");
      sel.innerHTML = "";
      Object.entries(appState.days).forEach(([k, d]) => {
        const opt = document.createElement("option");
        opt.value = k;
        opt.textContent = `${d.label} (${d.dayType})`;
        if (k === currentDayKey) opt.selected = true;
        sel.appendChild(opt);
      });

      // 1. Render Top Workouts Hub
      renderWorkoutsHub(day);

      // 2. Render Clean Timeblock Schedule List Below (with inline 'Not Today' button on non-recurring tasks)
      const list = document.getElementById("bubbleList");
      list.innerHTML = "";

      day.blocks.forEach((b, idx) => {
        const pushCount = Number(b.pushCount || 0);
        const heatLvl = getHeatLevel(pushCount);
        const heatClass = heatLvl > 0 ? ` push-heat-${heatLvl}` : "";
        const recurring = isRecurringBlock(b);

        const rowEl = document.createElement("div");
        rowEl.className = "bubble-row" + (b.completed ? " completed" : "") + heatClass;

        let notTodayBtnHTML = "";
        if (!recurring && !b.completed) {
          const btnHeatClass = heatLvl > 0 ? ` heat-${heatLvl}` : "";
          const label = pushCount > 0 ? `Not Today (${pushCount}x) ↷` : `Not Today ↷`;
          notTodayBtnHTML = `
            <button class="not-today-btn${btnHeatClass}" title="Push task to tomorrow (gets redder each push)" onclick="event.stopPropagation(); pushTaskNotToday(${idx})">
              ${label}
            </button>
          `;
        }

        rowEl.innerHTML = `
          <div class="row-main" onclick="toggleBlock(${idx})">
            <div class="bubble-circle">${CHECK_SVG}</div>
            <div class="row-text">
              <div class="row-line">
                <div class="row-line-left">
                  <span class="time-str">${b.time}</span>
                  <span class="task-str">${b.task}</span>
                </div>
                ${notTodayBtnHTML}
              </div>
            </div>
          </div>
        `;
        list.appendChild(rowEl);
      });

      const goalGrid = document.getElementById("goalGrid");
      if (goalGrid && appState.goals) {
        goalGrid.innerHTML = appState.goals.map(g => `
          <div class="goal-box">
            <div class="goal-box-name">${g.name}</div>
            <div class="goal-box-nums">${g.baselineDisplay} -> ${g.targetDisplay}</div>
            <div class="goal-box-pace">${g.pace}</div>
          </div>
        `).join("");
      }

      renderBacklog();
    }

    function renderBacklog() {
      const items = (appState.backlog || []).filter(x => x.status !== "Completed");
      document.getElementById("backlogCount").textContent = items.length;
      const tiers = ["This week", "This month", "YouTube", "Bigger projects", "Computer Tasks", "General To Do"];
      const tf = document.getElementById("tierFilter");
      tf.innerHTML = tiers.map(t => `
        <span class="tier-chip ${t === activeTier ? 'active' : ''}" onclick="activeTier='${t}';renderBacklog()">${t}</span>
      `).join("");

      const filtered = items.filter(x => x.tier === activeTier);
      const bl = document.getElementById("backlogList");
      bl.innerHTML = filtered.map(x => {
        const pCount = Number(x.pushCount || 0);
        const hLvl = getHeatLevel(pCount);
        const rowHeat = hLvl > 0 ? ` push-heat-${hLvl}` : "";
        const btnHeat = hLvl > 0 ? ` heat-${hLvl}` : "";
        const pushLabel = pCount > 0 ? `Not Today (${pCount}x)` : `Not Today`;
        return `
          <div class="backlog-item${rowHeat}">
            <span style="flex:1;min-width:0;">${x.starred ? "[*] " : ""}${x.title} <small style="color:var(--text-dim)">(${x.env})</small></span>
            <div style="display:flex;align-items:center;gap:5px;">
              <button class="not-today-btn${btnHeat}" onclick="pushBacklogItemNotToday('${x.id}')">${pushLabel}</button>
              <button class="step-btn" style="width:auto;height:21px;padding:0 8px;font-size:10.5px;" onclick="completeBacklogItem('${x.id}')">Done</button>
            </div>
          </div>
        `;
      }).join("");
    }

    function completeBacklogItem(id) {
      const item = (appState.backlog || []).find(x => x.id === id);
      if (item) {
        item.status = "Completed";
        renderBacklog();
        saveState(false);
      }
    }

    function openCompletedWorkoutsPage() {
      const day = appState.days[currentDayKey];
      if (!day) return;
      ensureDayWorkoutData(day);
      const m = day.metrics;
      const cfg = getPushupSetConfig();
      const hc = getHoldConfig();

      const doneSets = m.pushup_sets_done || [];
      const pushupsAllDone = doneSets.length > 0 && doneSets.every(Boolean);
      const extraLog = m.pushup_extra_log || [];
      const extraTotal = m.pushups_day || 0;
      const amTotal = m.pushups_morning || 0;

      const items = [];
      if (pushupsAllDone) {
        const extraTxt = extraLog.length > 0 ? ` + Extra (${extraLog.map(v => "+" + v).join(", ")})` : "";
        items.push({
          key: "pushups",
          title: "Pushups",
          sub: `Morning Baseline (${cfg.join("/")})${extraTxt}`,
          val: `${amTotal + extraTotal} reps`,
          allowExtraPlus: true
        });
      }
      if (m.plank_done) {
        items.push({
          key: "plank",
          title: "Plank Hold",
          sub: `Baseline Target: ${fmtSec(hc.plankTargetSec)} · 2027 Goal: ${fmtSec(hc.plankGoalSec)}`,
          val: fmtSec(m.plank_sec || hc.plankTargetSec)
        });
      }
      if (m.horse_done) {
        items.push({
          key: "horse",
          title: "Horse Stance Hold",
          sub: `Baseline Target: ${fmtSec(hc.horseTargetSec)} · 2027 Goal: ${fmtSec(hc.horseGoalSec)}`,
          val: fmtSec(m.horse_sec || hc.horseTargetSec)
        });
      }
      if (m.peloton_bike_done) {
        items.push({
          key: "peloton_bike",
          title: "Peloton Bike Ride",
          sub: "Daily Non-Negotiable Post-Walk Ride (Min 10m)",
          val: `${m.peloton_bike || 10} mins`
        });
      }
      if (m.peloton_stretch_done) {
        items.push({
          key: "peloton_stretch",
          title: "Peloton Post-Ride Stretch",
          sub: "Daily Mobility & Recovery (Min 10m)",
          val: `${m.peloton_stretch || 10} mins`
        });
      }

      document.getElementById("completedPageTitle").textContent = `${day.label} Completed`;
      document.getElementById("completedPagePill").textContent = `${items.length}/5`;

      const listEl = document.getElementById("completedWorkoutsList");
      if (items.length === 0) {
        listEl.innerHTML = `<div style="color:var(--text-muted);font-size:13px;padding:14px;text-align:center;">No workouts completed yet today.</div>`;
      } else {
        listEl.innerHTML = items.map(it => `
          <div class="completed-summary-card">
            <div style="min-width:0;">
              <div class="completed-summary-title">✓ ${it.title}</div>
              <div class="completed-summary-sub">${it.sub}</div>
            </div>
            <div class="completed-summary-actions">
              <div class="completed-summary-val">${it.val}</div>
              ${it.allowExtraPlus ? `<button class="compact-plus-btn" style="height:28px;min-width:28px;" title="Add Extra Pushups" onclick="openNumpad()">+</button>` : ""}
              <button class="restore-btn" onclick="restoreCompletedWorkout('${it.key}')">Edit</button>
            </div>
          </div>
        `).join("");
      }

      document.getElementById("completedWorkoutsPage").classList.add("open");
    }

    function restoreCompletedWorkout(wKey) {
      const day = appState.days[currentDayKey];
      if (!day) return;
      ensureDayWorkoutData(day);
      cancelAutoHide(wKey);
      if (wKey === "pushups") {
        day.metrics.pushup_sets_done = day.metrics.pushup_sets_done.map(() => false);
        recalcPushupTotals(day);
      } else if (wKey === "plank") {
        day.metrics.plank_done = false;
      } else if (wKey === "horse") {
        day.metrics.horse_done = false;
      } else if (wKey === "peloton_bike") {
        day.metrics.peloton_bike_done = false;
      } else if (wKey === "peloton_stretch") {
        day.metrics.peloton_stretch_done = false;
      }
      closeCompletedWorkoutsPage();
      renderAll();
      saveState(true);
      showToast("Restored to Daily Workouts for editing");
    }

    function closeCompletedWorkoutsPage() {
      document.getElementById("completedWorkoutsPage").classList.remove("open");
    }

    function togglePanel(id) {
      const el = document.getElementById(id);
      el.classList.toggle("open");
    }

    function openAddModal() {
      document.getElementById("addModal").classList.add("open");
      document.getElementById("newTaskTitle").focus();
    }

    function closeAddModal() {
      document.getElementById("addModal").classList.remove("open");
    }

    function toggleTimeInput(val) {
      document.getElementById("newTaskTime").style.display = val === "today" ? "block" : "none";
    }

    function submitQuickAdd() {
      const title = document.getElementById("newTaskTitle").value.trim();
      const bucket = document.getElementById("newTaskBucket").value;
      const timeStr = document.getElementById("newTaskTime").value.trim() || "3:15 - 5:00 PM";
      if (!title) return;

      if (bucket === "today") {
        const day = appState.days[currentDayKey];
        day.blocks.push({
          row: day.blocks.length + 1,
          time: timeStr,
          task: title,
          completed: false,
          recurring: false,
          pushCount: 0,
          metricKeys: []
        });
      } else {
        appState.backlog = appState.backlog || [];
        appState.backlog.unshift({
          id: "T-" + Date.now().toString().slice(-4),
          tier: bucket,
          title: title,
          starred: true,
          env: "Indoor",
          status: "Active",
          pushCount: 0
        });
        activeTier = bucket;
      }

      document.getElementById("newTaskTitle").value = "";
      closeAddModal();
      renderAll();
      saveState(false);
    }

    async function saveState(silent = false) {
      try {
        localStorage.setItem("timeblocks_state_v1", JSON.stringify(appState));
      } catch (_) {}

      if (IS_GAS_FRAME) {
        google.script.run.withSuccessHandler(function() {
          if (!silent) showToast("Saved to Google Sheet");
        }).writeLiveState(appState);
        return;
      }

      if (IS_LOCAL_DEV) {
        try {
          await fetch("/api/state", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(appState)
          });
          if (!silent) showToast("Saved");
        } catch (e) {
          if (!silent) showToast("Saved locally");
        }
        return;
      }

      // GitHub Pages / Standalone PWA -> POST as text/plain (avoids CORS preflight on Google Apps Script)
      try {
        await fetch(CLOUD_API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(appState)
        });
        if (!silent) showToast("Saved to Cloud");
      } catch (e) {
        if (!silent) showToast("Saved locally");
      }
    }

    async function syncToSheetDB() {
      showToast("Syncing to Google Sheet DB...");
      if (IS_GAS_FRAME) {
        google.script.run.withSuccessHandler(function(res) {
          if (res && res.ok) showToast("Synced to Google Sheet Database");
          else showToast("Sync error");
        }).syncDayToDatabaseTabs(currentDayKey, appState);
        return;
      }

      if (IS_LOCAL_DEV) {
        await saveState(true);
        try {
          const res = await fetch("/api/log-sheet", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ dayKey: currentDayKey })
          });
          const data = await res.json();
          if (res.ok && data.ok) showToast("Synced to Google Sheet Database");
          else showToast("Sync failed");
        } catch (e) {
          showToast("Server offline");
        }
        return;
      }

      // GitHub Pages / Standalone PWA -> trigger log-sheet action on Cloud API
      try {
        await fetch(CLOUD_API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "log-sheet", dayKey: currentDayKey, state: appState })
        });
        showToast("Logged to Google Sheet Database");
      } catch (e) {
        showToast("Sync error");
      }
    }

    loadState();
  </script>
</body>
</html>
